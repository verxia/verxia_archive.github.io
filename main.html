<main html>
<html>
  <head>
    <title>Main</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .parent {
        position: relative;
        grid-template-rows: 100px 1fr 1fr 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr 1fr ;

        display: inline-grid;
        height: 100%;

        justify-items: center;

      }
      .headerbkdg {
        grid-column-start: 2;
        grid-column-end: 4;
        grid-row-start: 2;
        grid-row-end: 4;

        max-width: 100%;
        max-height: 100vh;
        margin:auto
     
      }
      .veronicax {
        grid-column-start: 1;
        grid-column-end: 5;
        grid-row-start: 1;
        grid-row-end: 4;
        
        max-width: 100%;
        max-height: 100vh;
        margin: auto;
      }
      .arrow {
        grid-column-start: 2;
        grid-column-end: 4;
        grid-row: 4;

        width: 20%;
        height: 30vh;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <img class="headerbkdg" src="headerbkgd.png"  />
      <img class="veronicax" src="veronicax.svg"  />
      <img class="arrow" src="arrow.svg" width="50"/>
    </div>

    <div class="about" >
        <b>This text is bold</b>
    </div>
  </body>
</html>
